services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}
    volumes:
      - kra_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - kra_private

  kra-pin-proxy:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      KRA_ENVIRONMENT: ${KRA_ENVIRONMENT:-sandbox}
      KRA_MOCK: ${KRA_MOCK:-true}
      IDEMPOTENCY_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      IDEMPOTENCY_ENCRYPTION_KEY: ${IDEMPOTENCY_ENCRYPTION_KEY:?Set IDEMPOTENCY_ENCRYPTION_KEY in the root .env file}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kra_private

volumes:
  kra_redis_data:

networks:
  kra_private:
    internal: true
