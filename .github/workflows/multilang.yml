name: Multi-language CI
on:
  workflow_dispatch:
  push:
    paths: ['server/**','languages/**','contracts/**','scripts/**','sandbox-fixtures/**','.github/workflows/**','.gitlab-ci.yml']
  pull_request:
    paths: ['server/**','languages/**','contracts/**','scripts/**','sandbox-fixtures/**','.github/workflows/**','.gitlab-ci.yml']
permissions:
  contents: read
concurrency:
  group: multilang-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/validate-catalog.py
      - run: python scripts/validate-oscu-contract.py
      - run: python -m py_compile scripts/validate-catalog.py scripts/validate-oscu-contract.py scripts/validate-production-config.py scripts/summarize-junit.py scripts/run-oscu-sandbox-check.py server/app/dotenv_loader.py
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: server/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
        working-directory: server
      - run: ruff check .
        working-directory: server
      - run: PYTHONPATH=. pytest -q
        working-directory: server
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.22'}
      - run: cd languages/go && go test ./...
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: cd languages/java && mvn -B test
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: cd languages/javascript && npm install --no-audit --no-fund && npm test
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: cd languages/typescript && npm install --no-audit --no-fund && npm test
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: curl}
      - run: cd languages/php && composer install --no-interaction --prefer-dist && composer test
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.3', bundler-cache: true, working-directory: languages/ruby}
      - run: cd languages/ruby && bundle exec rspec
