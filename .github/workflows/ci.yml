name: CI
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Validate KRA catalogs and OSCU contracts
        run: python ../scripts/validate-catalog.py && python ../scripts/validate-oscu-contract.py
      - name: Compile runner and configuration helpers
        run: python -m py_compile ../scripts/run-oscu-sandbox-check.py app/dotenv_loader.py app/idempotency.py
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mkdir -p reports && pytest -q --junitxml=reports/python-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-junit-${{ matrix.python }}
          path: server/reports/python-junit.xml
          if-no-files-found: ignore
          retention-days: 14
